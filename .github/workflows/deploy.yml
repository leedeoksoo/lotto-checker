name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 회차 기록을 배포할 때마다 갱신하려면 저장소 Variables 에
      # FETCH_ON_DEPLOY = true 를 추가하세요. 실패해도 배포는 계속됩니다.
      - name: Refresh lotto history
        if: vars.FETCH_ON_DEPLOY == 'true'
        continue-on-error: true
        run: python3 scripts/fetch_lotto_history.py -o public/lotto_history.json

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
