name: Build Android APK

# v 로 시작하는 태그를 밀면 APK 를 빌드해 Release 에 첨부합니다.
#   git tag v1.0.0 && git push origin v1.0.0
# 태그 없이 확인만 하고 싶으면 Actions 탭에서 «Run workflow» 로 직접 돌리세요.
# (그때는 Release 없이 아티팩트로만 올라갑니다.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # Capacitor 8 CLI 는 Node 22 이상을 요구합니다
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # 회차 기록을 앱 안에 넣어 비행기모드에서도 대조가 되게 합니다.
      # 실패해도(사이트 개편 등) 저장소에 있는 기록으로 빌드는 계속합니다.
      - name: Refresh lotto history
        continue-on-error: true
        run: python3 scripts/fetch_lotto_history.py -o public/lotto_history.json

      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        # Windows 에서 커밋되면 실행 권한이 빠질 수 있어 여기서 한 번 더 챙깁니다.
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/lotto-checker-${GITHUB_REF_NAME}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: lotto-checker-apk
          path: out/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.apk \
            --title "$GITHUB_REF_NAME" \
            --notes "안드로이드 앱입니다. APK 를 폰에서 내려받아 설치하세요.

          설치하려면 «출처를 알 수 없는 앱» 설치를 한 번 허용해야 합니다.
          (브라우저에서 받은 경우: 설정 → 앱 → 특별한 액세스 → 알 수 없는 앱 설치)

          디버그 서명이라 Play 스토어 앱과는 별개로 설치됩니다." \
            || gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
